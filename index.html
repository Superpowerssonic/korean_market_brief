function renderSummary(data){ const count=data.length; const avgRs=count?data.reduce((a,b)=>a+(b.rs||0),0)/count:0; const avgR20=count?data.reduce((a,b)=>a+(b.r20||0),0)/count:0; const avgTV=count?data.reduce((a,b)=>a+(b.vsurge||0),0)/count:0; const newHigh=data.filter(x=>x.new_high===1).length; const nearHigh=data.filter(x=>x.near_high===1).length; const sectorMap={}; data.forEach(x=>sectorMap[x.sector]=(sectorMap[x.sector]||0)+1); const topSector=Object.entries(sectorMap).sort((a,b)=>b[1]-a[1])[0] || ['-',0]; document.getElementById('summary').innerHTML=`<div class="box panel"><div class="k">Final Leaders</div><div class="v">${num(count)}</div><div class="d">This is the final short list after the ranking process narrows the day's candidates.[cite:823]</div></div><div class="box panel"><div class="k">New 52W Highs</div><div class="v">${num(newHigh)}</div><div class="d">A higher count usually means leadership is already breaking into price-discovery territory.</div></div><div class="box panel"><div class="k">Near Highs</div><div class="v">${num(nearHigh)}</div><div class="d">These names are often the most important watchpoints for follow-through and next-leg breakouts.</div></div><div class="box panel"><div class="k">Avg RS</div><div class="v">${avgRs.toFixed(1)}</div><div class="d">Higher average RS implies stronger cross-sectional leadership quality.</div></div><div class="box panel"><div class="k">Avg 20D / TV</div><div class="v">${avgR20.toFixed(1)}% / ${avgTV.toFixed(2)}x</div><div class="d">This pairs trend persistence with participation quality in one glance.</div></div><div class="box panel"><div class="k">Top Sector</div><div class="v">${topSector[0]}</div><div class="d">${topSector[0]} accounts for ${topSector[1]} of the currently displayed leaders.</div></div>`; }
function filterData(){ const q=document.getElementById('searchBox').value.trim().toLowerCase(); const market=document.getElementById('marketFilter').value; const sector=document.getElementById('sectorFilter').value; const state=document.getElementById('stateFilter').value; const sortBy=document.getElementById('sortBy').value; const data=CARDS.filter(c=>{ const mq=!q || (c.name||'').toLowerCase().includes(q) || (c.code||'').toLowerCase().includes(q); const mm=!market || c.market===market; const ms=!sector || c.sector===sector; const st= state==='' || (state==='NEW' && c.new_high===1) || (state==='NEAR' && c.new_high!==1 && c.near_high===1) || (state==='OTHER' && c.new_high!==1 && c.near_high!==1); return mq&&mm&&ms&&st; }); data.sort((a,b)=>(b[sortBy]??-999999)-(a[sortBy]??-999999)); return data; }
function buildCharts(data){ const labels=data.map(x=>x.name); const colors=data.map(x=>x.new_high===1 ? '#22c55e' : x.near_high===1 ? '#60a5fa' : '#94a3b8'); Plotly.newPlot('barChart', [{x:labels,y:data.map(x=>x.priority_score),type:'bar',name:'Priority Score',marker:{color:colors},customdata:data.map(x=>[x.sector,x.rs,x.vsurge,x.r20,x.state_label]),hovertemplate:'<b>%{x}</b><br>Priority: %{y:.1f}<br>Sector: %{customdata[0]}<br>RS: %{customdata[1]:.1f}<br>TV Surge: %{customdata[2]:.2f}x<br>20D: %{customdata[3]:.1f}%<br>State: %{customdata[4]}<extra></extra>'},{x:labels,y:data.map(x=>x.r20),type:'scatter',mode:'lines+markers',name:'20D Return',line:{color:'#f59e0b',width:2},marker:{size:8}}],{paper_bgcolor:'#121a2b',plot_bgcolor:'#121a2b',font:{color:'#e5e7eb'},margin:{l:50,r:20,t:20,b:60},xaxis:{tickangle:-25},yaxis:{gridcolor:'#2a3140'},legend:{orientation:'h',y:1.12}},{responsive:true,displayModeBar:false}); Plotly.newPlot('scatterChart',[{x:data.map(x=>x.rs),y:data.map(x=>x.vsurge),text:data.map(x=>`${x.name}<br>${x.sector}<br>${x.state_label}`),mode:'markers+text',type:'scatter',textposition:'top center',marker:{size:data.map(x=>Math.max(14,(x.priority_score||0)/3)),color:data.map(x=>x.r20),colorscale:'Blues',line:{color:'#dbeafe',width:1},opacity:.88},hovertemplate:'<b>%{text}</b><br>RS: %{x:.1f}<br>TV Surge: %{y:.2f}x<extra></extra>'}],{paper_bgcolor:'#121a2b',plot_bgcolor:'#121a2b',font:{color:'#e5e7eb'},margin:{l:50,r:20,t:20,b:50},xaxis:{title:'RS',gridcolor:'#2a3140'},yaxis:{title:'TV Surge',gridcolor:'#2a3140'}},{responsive:true,displayModeBar:false}); }
function renderCards(data){ const grid=document.getElementById('cardGrid'); if(!data.length){ grid.innerHTML='<div class="empty">No stocks match the current filters.</div>'; return; } grid.innerHTML=data.map(c=>{ const badges=[`<div class="badge rank">#${c.rank}</div>`]; if(c.new_high===1) badges.push('<div class="badge new">NEW 52W HIGH</div>'); else if(c.near_high===1) badges.push('<div class="badge near">NEAR 52W HIGH</div>'); if((c.vsurge||0)>=1.5) badges.push(`<div class="badge tv">TV SURGE ${(c.vsurge||0).toFixed(2)}x</div>`); if((c.rs||0)>0) badges.push(`<div class="badge rs">RS ${(c.rs||0).toFixed(1)}</div>`); const flags=[]; flags.push(`<span class="flag">Signal Count: ${num(c.signal_count)}</span>`); flags.push(`<span class="flag">State: ${c.state_label}</span>`); flags.push(`<span class="flag">52W Type: ${c.high52_type || '-'}</span>`); flags.push(`<span class="flag">TV Type: ${c.vsurge_type || '-'}</span>`); if(c.flags) flags.push(`<span class="flag">Risk Tags: ${c.flags}</span>`); const likes=(c.likes||[]).map(x=>`<li>${x}</li>`).join(''); return `<div class="card"><div class="card-head"><div><div class="title">${c.name} (${c.code})</div><div class="subline">${c.market || '-'} · ${c.sector || '-'} · Priority ${num(c.priority_score)} · RS Rank ${num(c.rs_rank)}</div><div class="tagline">${c.tagline}</div></div><div class="badges">${badges.join('')}</div></div><div class="story"><div class="hk">Selection Rationale</div><div class="hv">${c.reason || 'No stock-specific rationale available.'}</div></div><div class="metrics"><div class="metric"><div class="k">1D Return</div><div class="v">${pct(c.r1)}</div></div><div class="metric"><div class="k">5D Return</div><div class="v">${pct(c.r5)}</div></div><div class="metric"><div class="k">20D Return</div><div class="v">${pct(c.r20)}</div></div><div class="metric"><div class="k">60D Return</div><div class="v">${pct(c.r60)}</div></div><div class="metric"><div class="k">Close</div><div class="v">${num(c.close)}</div></div></div><div class="metrics"><div class="metric"><div class="k">RS</div><div class="v">${num(c.rs)}</div></div><div class="metric"><div class="k">RS Rank</div><div class="v">${num(c.rs_rank)}</div></div><div class="metric"><div class="k">TV Surge</div><div class="v">${xmul(c.vsurge)}</div></div><div class="metric"><div class="k">20D Avg TV</div><div class="v">${num(c.value20)}</div></div><div class="metric"><div class="k">Priority</div><div class="v">${num(c.priority_score)}</div></div></div><div class="flags">${flags.join('')}</div><div class="cols"><div class="info"><div class="it">What We Like</div><div class="iv"><ul class="bullets">${likes}</ul></div></div><div class="info"><div class="it">Key Risk / Caveat</div><div class="iv">${c.risk_line}</div></div></div><div class="cols"><div class="info"><div class="it">Business Overview</div><div class="iv">${c.overview || '-'}</div></div><div class="info"><div class="it">Why It Matters Today</div><div class="iv">${c.tagline} ${c.new_high===1 ? 'The chart is already proving itself through a fresh high.' : c.near_high===1 ? 'The setup matters because a clean breakout could quickly move it into leadership territory.' : 'The setup matters because it keeps scoring well across the board even without a headline breakout.'}</div></div></div><div class="small">The dashboard text and card structure are fully in English and are designed for foreign retail investors tracking Korean market leadership.[cite:823][cite:846][cite:848]</div></div>`; }).join(''); }
function rerender(){ const data=filterData(); renderSummary(data); buildCharts(data); renderCards(data); }
fillHero(); fillFilters(); ['searchBox','marketFilter','sectorFilter','stateFilter','sortBy'].forEach(id=>{ document.getElementById(id).addEventListener('input',rerender); document.getElementById(id).addEventListener('change',rerender); }); rerender();
</script>
